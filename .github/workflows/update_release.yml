name: Deploy MkDocs site to GitHub Pages

# Callable only. From an ontology repo (often chained after release-on-merge):
#
#   jobs:
#     deploy:
#       uses: <owner>/ontology-shared-scripts/.github/workflows/update_release.yml@<ref>
#       with:
#         release_tag: v1.2.3
#       secrets: inherit

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Git tag / mike version to deploy (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y weasyprint
          pip install mkdocs-material pymdown-extensions
          pip install mkdocs-git-revision-date-localized-plugin
          pip install mkdocs-to-pdf
          pip install mike pymdown-extensions mkdocs-mermaid2-plugin
          npm install -g @mermaid-js/mermaid-cli

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            echo "release_tag input is required" >&2
            exit 1
          fi
          echo "Resolved RELEASE_TAG=$TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Replace placeholders in files
        run: |
          RELEASE_TAG="${{ env.RELEASE_TAG }}"
          sed -i "s/{{ release_number }}/$RELEASE_TAG/g" mkdocs.yml
          if [ -f docs/index.md ]; then
            sed -i "s/{{ release_number }}/$RELEASE_TAG/g" docs/index.md
          fi

      - name: Set EXPORT_PDF environment variable
        run: echo "EXPORT_PDF=1" >> "$GITHUB_ENV"

      - name: Build and deploy site with mike
        run: |
          RELEASE_TAG="${{ env.RELEASE_TAG }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mike set-default --push latest --allow-undefined
          mike deploy --branch=gh-pages --push --update-aliases "$RELEASE_TAG" latest

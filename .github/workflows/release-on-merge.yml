name: Apply VERSION and publish release

# Callable only. From an ontology repo:
#
#   on:
#     push:
#       branches: [main, master]
#   jobs:
#     release:
#       if: ${{ !github.event.repository.fork }}
#       uses: <owner>/ontology-shared-scripts/.github/workflows/release-on-merge.yml@<ref>
#       secrets: inherit
#     deploy:
#       needs: release
#       if: needs.release.outputs.publish == 'true' && needs.release.outputs.tag != ''
#       uses: <owner>/ontology-shared-scripts/.github/workflows/update_release.yml@<ref>
#       with:
#         release_tag: ${{ needs.release.outputs.tag }}
#       secrets: inherit
#
# Stamps docs/**/*.ttl that already have owl:versionInfo, appends RELEASES,
# commits if needed, and creates a GitHub Release/tag.
# Deploy is a separate callable workflow so callers can chain it (nested
# relative uses: ./ would resolve against the caller repo, not this one).

on:
  workflow_call:
    outputs:
      tag:
        description: "Git tag for this release"
        value: ${{ jobs.release.outputs.tag }}
      publish:
        description: "Whether a GitHub Release should be / was published"
        value: ${{ jobs.release.outputs.publish }}
      kind:
        description: "ontology or doc-only"
        value: ${{ jobs.release.outputs.kind }}
      version:
        description: "SemVer from VERSION"
        value: ${{ jobs.release.outputs.version }}
      prerelease:
        description: "true if ontology pre-release"
        value: ${{ jobs.release.outputs.prerelease }}

permissions:
  contents: write

jobs:
  release:
    name: apply-and-release
    # Never run release automation on forks — that pollutes fork main with
    # bot VERSION/RELEASES commits ahead of upstream.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.apply.outputs.tag }}
      publish: ${{ steps.apply.outputs.publish }}
      kind: ${{ steps.apply.outputs.kind }}
      version: ${{ steps.apply.outputs.version }}
      prerelease: ${{ steps.apply.outputs.prerelease }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve shared scripts source
        id: shared
        run: |
          set -euo pipefail
          # github.workflow_ref: owner/repo/.github/workflows/file.yml@ref
          REF='${{ github.workflow_ref }}'
          echo "repo=${REF%%/.github/*}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF##*@}" >> "$GITHUB_OUTPUT"

      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.shared.outputs.repo }}
          ref: ${{ steps.shared.outputs.ref }}
          path: .ontology-shared-scripts
          sparse-checkout: |
            scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply VERSION (stamp TTL / append RELEASES)
        id: apply
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAGS=$(git tag -l | paste -sd, -)
          python3 .ontology-shared-scripts/scripts/versioning.py apply \
            --existing-tags "$TAGS" | tee /tmp/version-apply.out
          grep -E '^(kind|version|tag|prerelease|changed|publish)=' \
            /tmp/version-apply.out >> "$GITHUB_OUTPUT"

      - name: Commit stamped metadata
        id: commit
        if: steps.apply.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # RELEASES plus whatever docs/**/*.ttl the stamp step actually modified
          git add RELEASES
          git add -u -- docs/
          if git diff --staged --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "No additional file changes to commit"
          else
            git commit -m "chore(release): ${{ steps.apply.outputs.tag }} metadata"
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.apply.outputs.publish == 'true' && steps.apply.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.apply.outputs.tag }}
          KIND: ${{ steps.apply.outputs.kind }}
          VERSION: ${{ steps.apply.outputs.version }}
          PRERELEASE: ${{ steps.apply.outputs.prerelease }}
          TARGET: ${{ steps.commit.outputs.sha || github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists"
            exit 0
          fi
          ARGS=( "$TAG" --title "$TAG" --target "$TARGET" --generate-notes )
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=( --prerelease )
          fi
          ARGS+=( --notes "Automated release from VERSION (${KIND} ${VERSION})." )
          gh release create "${ARGS[@]}"
          echo "Created GitHub Release $TAG"
